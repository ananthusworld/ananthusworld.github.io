<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1075" viewBox="0 0 1536 1075" role="img" aria-labelledby="title desc">
  <title id="title">Mobile SRE Architecture on Google Cloud</title>
  <desc id="desc">Mobile app connected to cloud CDN and Firebase observability, API gateway, GKE cloud run microservices, monitoring, and backend data services.</desc>
  <defs>
    <style>
      .title { font: 700 58px 'Segoe UI', Arial, sans-serif; fill: #273444; }
      .subtitle { font: 400 46px 'Segoe UI', Arial, sans-serif; fill: #44556b; }
      .label { font: 600 46px 'Segoe UI', Arial, sans-serif; fill: #1f2c3f; }
      .small { font: 500 40px 'Segoe UI', Arial, sans-serif; fill: #1f2c3f; }
      .tiny { font: 500 34px 'Segoe UI', Arial, sans-serif; fill: #3d4d63; }
      .box { fill: #f8fafc; stroke: #d1d9e4; stroke-width: 3; }
      .arrow { fill: none; stroke: #51657f; stroke-width: 4; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
      <polygon points="0,0 12,5 0,10" fill="#51657f" />
    </marker>
  </defs>

  <rect width="1536" height="1075" fill="#f1f3f6"/>

  <text x="768" y="95" class="title" text-anchor="middle">Mobile SRE Architecture on Google Cloud</text>
  <text x="768" y="155" class="subtitle" text-anchor="middle">Reliable &amp; Scalable Infrastructure for Retail &amp; Fintech Apps</text>

  <!-- Phone -->
  <rect x="52" y="355" width="190" height="420" rx="28" fill="#dfe6ee" stroke="#203047" stroke-width="10"/>
  <rect x="72" y="442" width="150" height="180" fill="#f7f9fc" stroke="#8ca0b8" stroke-width="2"/>
  <rect x="72" y="622" width="150" height="123" fill="#1859bb"/>
  <text x="147" y="691" text-anchor="middle" font-size="44" fill="#fff" font-family="Segoe UI" font-weight="700">Mobile App</text>
  <text x="147" y="731" text-anchor="middle" font-size="34" fill="#dbeafe" font-family="Segoe UI">(IOS / Android)</text>

  <!-- left stack -->
  <g transform="translate(292,350)">
    <rect class="box" width="390" height="90" rx="10"/>
    <circle cx="46" cy="45" r="26" fill="#3b82f6"/>
    <text x="46" y="56" text-anchor="middle" font-size="44" fill="#fff">◎</text>
    <text x="94" y="58" class="label">Cloud CDN</text>
  </g>

  <g transform="translate(292,470)">
    <rect class="box" width="390" height="90" rx="10"/>
    <text x="45" y="58" font-size="46">🔥</text>
    <text x="94" y="58" class="label">Firebase</text>
    <text x="94" y="93" class="tiny">Crashlytics</text>
  </g>

  <g transform="translate(292,590)">
    <rect class="box" width="390" height="90" rx="10"/>
    <text x="45" y="58" font-size="46">📍</text>
    <text x="94" y="58" class="label">Firebase</text>
    <text x="94" y="93" class="tiny">Performance</text>
  </g>

  <g transform="translate(292,710)">
    <rect class="box" width="390" height="90" rx="10"/>
    <text x="45" y="58" font-size="46">☁️</text>
    <text x="94" y="58" class="label">Firebase</text>
    <text x="94" y="93" class="tiny">Analytics</text>
  </g>

  <!-- API -->
  <g transform="translate(730,510)">
    <rect class="box" width="180" height="95" rx="10"/>
    <text x="90" y="56" text-anchor="middle" class="small">API Gateway /</text>
    <text x="90" y="96" text-anchor="middle" class="small">Apigee</text>
  </g>

  <!-- core services -->
  <g transform="translate(965,445)">
    <rect class="box" width="500" height="210" rx="12"/>
    <text x="250" y="82" text-anchor="middle" class="label">GKE / Cloud Run</text>
    <text x="250" y="138" text-anchor="middle" class="label">Microservices</text>
    <rect x="236" y="150" width="75" height="30" fill="#7189a3" rx="4"/>
    <rect x="318" y="150" width="75" height="30" fill="#617a95" rx="4"/>
    <rect x="400" y="150" width="75" height="30" fill="#7e90a5" rx="4"/>
  </g>

  <g transform="translate(940,720)">
    <rect class="box" width="560" height="95" rx="10"/>
    <text x="280" y="60" text-anchor="middle" class="small">Cloud Monitoring &amp; Logging</text>
  </g>

  <g transform="translate(965,870)">
    <rect class="box" width="500" height="125" rx="10"/>
    <text x="250" y="73" text-anchor="middle" class="small">Grafana &amp; Looker</text>
    <text x="250" y="112" text-anchor="middle" class="small">Dashboards</text>
  </g>

  <!-- right side -->
  <g transform="translate(1760,350)">
    <text x="0" y="0"/>
  </g>

  <text x="1306" y="380" font-size="56">🛢️</text>
  <text x="1380" y="385" class="label">Cloud SQL / Spanner</text>

  <text x="1306" y="520" font-size="56">🔥</text>
  <text x="1380" y="525" class="label">Firestore Database</text>

  <text x="1306" y="660" font-size="56">💬</text>
  <text x="1380" y="665" class="label">Pub/Sub Messaging</text>

  <text x="1306" y="800" font-size="56">🧱</text>
  <text x="1380" y="805" class="label">Redis Cache</text>

  <!-- arrows -->
  <path class="arrow" d="M242 400 H286"/>
  <path class="arrow" d="M242 530 H286"/>
  <path class="arrow" d="M242 650 H286"/>

  <path class="arrow" d="M682 395 H710 V560 H728"/>
  <path class="arrow" d="M682 515 H728"/>

  <path class="arrow" d="M910 558 H962"/>

  <path class="arrow" d="M1465 550 H1536 V385 H1310"/>
  <path class="arrow" d="M1465 550 H1536 V525 H1310"/>
  <path class="arrow" d="M1465 550 H1536 V665 H1310"/>
  <path class="arrow" d="M1465 550 H1536 V805 H1310"/>

  <path class="arrow" d="M1215 870 V817"/>
  <path class="arrow" d="M1215 720 V658"/>
</svg>
